[project]
name = "edgeinfer"
version = "0.1.0"
description = "Minimal Qwen3 inference runtime with layer-wise weight offloading"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch",
    "transformers",
    "tokenizers",
    "safetensors",
    "huggingface-hub",
    "numpy",
    "einops",
    "tqdm",
    "pyyaml",
    "pandas",
    "matplotlib",
    "nvidia-ml-py",
    "psutil",
    "rich",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "ipython",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
